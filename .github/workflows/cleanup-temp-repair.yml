name: Temporary repair workflow cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run temporary repair workflow cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/patch-no-docker-enospc.yml
          rm -f .github/workflows/cleanup-temp-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'Remove temporary repair workflows'
          git push origin HEAD:main
