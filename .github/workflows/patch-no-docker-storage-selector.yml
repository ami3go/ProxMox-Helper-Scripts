name: Temporary no-Docker storage selector cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Cleanup no-docker storage selector workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove temporary patch files
        run: |
          rm -f .github/workflows/patch-no-docker-storage-selector.yml
          rm -f TEMP_STORAGE_SELECTOR_TRIGGER.txt
          rm -f TEMP_STORAGE_SELECTOR_CLEANUP_TRIGGER.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean up temporary storage selector workflow'
          git push origin HEAD:main
