name: Validate helper repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zip python3-pil python3-yaml

      - name: Validate repository
        run: sudo -E ./scripts/validate.sh

      - name: Build release package
        run: ./scripts/package-release.sh

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-helper-scripts-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
