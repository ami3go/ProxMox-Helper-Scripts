name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zip

      - name: Verify tag and repository version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          }

      - name: Build release files
        run: OUT_DIR=dist sudo -E ./scripts/package-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "Proxmox Helper Scripts $GITHUB_REF_NAME"
