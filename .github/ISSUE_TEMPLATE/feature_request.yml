name: Feature or helper request
description: Propose a new helper or a focused framework, security, release, or documentation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - New helper
        - Existing helper enhancement
        - Shared library or launcher enhancement
        - Validation or release enhancement
        - Documentation or Pages enhancement
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete workflow or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Include privileges, destructive actions, network exposure, package sources, storage changes, and supported Proxmox versions.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback or removal approach
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
